<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="markGrad" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B3DF6"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="90" y1="50" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2A1F63" flood-opacity="0.3"/>
    </filter>
    <filter id="chipShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2A1F63" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="132" fill="url(#markGrad)" filter="url(#softShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="132" fill="url(#gloss)"/>
  <rect x="176" y="176" width="160" height="160" rx="44" fill="#C6FF3D" filter="url(#chipShadow)"/>
</svg>
